name: bear-server
include:
  - ../network.yml
services:
  ddns:
    extends:
      file: ../service.yml
      service: base
    image: qmcgaw/ddns-updater
    container_name: ddns
    hostname: ddns.vip.bear-network
    environment:
      - LISTENING_ADDRESS=:8000
      - ROOT_URL=/
    volumes:
      - ddns_data:/updater/data
    secrets:
      - source: ddns_config
        target: /updater/data/config.json
volumes:
  ddns_data:
secrets:
  ddns_config:
    file: ../../secrets/ddns.json
