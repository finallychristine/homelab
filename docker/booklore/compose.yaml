name: bear-server
include:
  - ../network.yml
  - ../../secrets/nas_storage.yaml
  - volumes.yaml
services:
  booklore:
    extends:
      file: ../service.yml
      service: base
    hostname: booklore.vip.bear-network
    container_name: booklore
    image: booklore/booklore:latest
    environment:
      - DATABASE_URL=jdbc:mariadb://booklore-mariadb.vip.bear-network:3306/booklore   # Only modify this if you're familiar with JDBC and your database setup
      - DATABASE_USERNAME=booklore                          # Must match MYSQL_USER defined in the mariadb container
      - DATABASE_PASSWORD=your_secure_password              # Use a strong password; must match MYSQL_PASSWORD defined in the mariadb container
      - BOOKLORE_PORT=6060                                  # Port BookLore listens on inside the container; must match container port below
      - SWAGGER_ENABLED=false                               # Enable or disable Swagger UI (API docs). Set to 'true' to allow access; 'false' to block access (recommended for production).
      - FORCE_DISABLE_OIDC=false                            # Set to 'true' to force-disable OIDC and allow internal login, regardless of UI config
    depends_on:
      booklore-mariadb:
        condition: service_healthy
    volumes:
      - booklore-data:/app/data       # Application data (settings, metadata, cache, etc.). Persist this folder to retain your library state across container restarts.
      - booklore-bookdrop:/bookdrop   # BookDrop folder. Files placed here are automatically detected and prepared for import.
      - nas-ebooks:/books            # Primary book library folder. Mount your collection here so BookLore can access and organize your books.
    healthcheck:
      test: wget -q -O - http://localhost:6060/api/v1/healthcheck
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s
    restart: unless-stopped
    networks:
      - booklore-mariadb
  booklore-mariadb:
    extends:
      file: ../service.yml
      service: base-no-network
    hostname: booklore-mariadb.vip.bear-network
    container_name: booklore-mariadb
    image: lscr.io/linuxserver/mariadb:11.4.8
    labels:
      - docker-volume-backup.stop-during-backup=true
    environment:
      MYSQL_ROOT_PASSWORD: super_secure_password  # Use a strong password for the database's root user, should be different from MYSQL_PASSWORD
      MYSQL_DATABASE: booklore
      MYSQL_USER: booklore                        # Must match DATABASE_USERNAME defined in the booklore container
      MYSQL_PASSWORD: your_secure_password        # Use a strong password; must match DATABASE_PASSWORD defined in the booklore container
    volumes:
      - booklore-mariadb-storage:/config
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booklore-mariadb
networks:
  booklore-mariadb:
volumes:
  booklore-data:
  booklore-bookdrop:
