events {}

include mqtt.conf;

http {
    log_format logger-json escape=json '{"source": "nginx", "time": $msec, "resp_body_size": $body_bytes_sent, "host": "$http_host", "address": "$remote_addr", "request_length": $request_length, "method": "$request_method", "uri": "$request_uri", "status": $status,  "user_agent": "$http_user_agent", "resp_time": $request_time, "upstream_addr": "$upstream_addr"}';

    # error_log /var/log/nginx/error.log logger-json;

    server {
        listen 80 default_server deferred;
        listen [::]:80 default_server deferred;
        server_name _;

        location / {
            add_header Content-Type text/plain;
            return 502 'subdomain not configured';
        }

        location /__status {
          stub_status;
        }
    }

    server {
        listen 443 default_server deferred ssl;
        listen [::]:443 default_server deferred ssl;
        server_name _;

         # Certbot goodies
        ssl_certificate /etc/letsencrypt/live/beartree.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beartree.me/privkey.pem;

      location / {
            add_header Content-Type text/plain;
            return 502 'subdomain not configured';
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name ~^(?<subdomain>\w+)\.waller\.beartree\.me$;
        location / {
            rewrite ^ https://$subdomain.beartree.me$request_uri permanent;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name ~^(?<subdomain>\w+)\.waller\.beartree\.me$;

         # Certbot goodies
        ssl_certificate /etc/letsencrypt/live/waller.beartree.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/waller.beartree.me/privkey.pem;

        location / {
            rewrite ^ https://$subdomain.beartree.me$request_uri permanent;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name nginx.vip.bear-network;

        location / {
            add_header Content-Type text/plain;
            return 200 'Internal Webpage';
        }

        location /__status {
          stub_status;
        }
    }

    include proxies.d/*.conf;

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
}
