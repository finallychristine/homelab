# generated from generate.py
upstream loki {
  server loki.vip.bear-network:80 max_fails=0 resolve;
  zone docker 10m;
  resolver nginx-dns.vip.bear-network valid=1s;
}

server {
  listen 80;
  listen [::]:80;
  http2 on;
  server_name loki.localhost loki.waller.beartree.me;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  client_max_body_size 400M;
  server_name loki.localhost loki.waller.beartree.me;

  # Certbot goodies
  ssl_certificate /etc/letsencrypt/live/waller.beartree.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/waller.beartree.me/privkey.pem;

  location / {
    proxy_pass http://loki;
    proxy_ssl_session_reuse on;
    proxy_ssl_verify off;

    # Standard reverse proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Websocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
  }
}