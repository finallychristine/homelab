name: bear-server
include:
  - ../network.yml
  - ../monitoring/secrets.yaml
services:
  unifi-poller:
    extends:
      file: ../service.yml
      service: base
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unifi-poller
    hostname: unifi-poller.vip.bear-network
    volumes:
      - ./up.conf:/etc/unpoller/up.conf
    secrets:
      - unifi-udm-poller-password
secrets:
  unifi-udm-poller-password:
    file: ../../secrets/unifi-udm-poller-password
