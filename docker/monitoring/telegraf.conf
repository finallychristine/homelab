[[secretstores.docker]]
  id = "docker_secrets"

[[inputs.prometheus]]
  urls = ["http://unifi-poller.vip.bear-network:9130"]
  metric_version = 2
  name_override = "unifi"


[[inputs.nginx]]
  urls = ["http://nginx.vip.bear-network/__status"]

# [[inputs.docker]]
#   endpoint = "unix:///var/run/docker.sock"
#   gather_services = false
#   source_tag = false
#   timeout = "5s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.vip.bear-network:8181"]
  bucket = "telegraf"
  organization = "primary"
  token = "@{docker_secrets:influxdb_token}"
