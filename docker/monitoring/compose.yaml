name: bear-server
include:
  - ../network.yml
  - ../plex/volumes.yaml
  - ./secrets.yaml
  - ../uptime/secrets.yaml
services:
  grafana:
    extends:
      file: ../service.yml
      service: base
    image: grafana/grafana-oss:latest
    hostname: grafana.vip.bear-network
    container_name: grafana
    environment:
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    secrets:
      - influxdb-admin-token-text
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/ds.yaml
  loki:
    extends:
      file: ../service.yml
      service: base
    image: grafana/loki:latest
    container_name: loki
    hostname: loki.vip.bear-network
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml
  alloy:
    extends:
      file: ../service.yml
      service: base
    image:  grafana/alloy:latest
    container_name: alloy
    hostname: alloy.vip.bear-network
    command: [
      "run",
      "--server.http.listen-addr=0.0.0.0:80",
      "--storage.path=/var/lib/alloy/data",
      "/etc/alloy/config.alloy",
    ]
    volumes:
      - alloy_data:/var/lib/alloy/data
      - ./config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - plex_logs:/container-logs/plex
  prometheus:
    extends:
      file: ../service.yml
      service: base
    image: prom/prometheus
    container_name: prometheus
    hostname: prometheus.vip.bear-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=100GB'
      - '--log.level=debug'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    secrets:
      - uptime-api-key
volumes:
  grafana-data:
  loki-data:
  alloy_data:
  prometheus_data:
