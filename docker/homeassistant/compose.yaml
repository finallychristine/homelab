name: bear-server
include:
  - ../network.yml
  - volumes.yaml
  - ../certbot/volumes.yaml
services:
  homeassistant:
    extends:
      file: ../service.yml
      service: base
    container_name: homeassistant
    hostname: homeassistant.vip.bear-network
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - homeassistant-config:/config
      - ./ha-config:/config/ha-config
      - ./ha-config.yaml:/config/configuration.yaml
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    networks:
      bear-network-macvlan:
        ipv4_address: 192.168.1.100
    labels:
      - docker-volume-backup.stop-during-backup=true
    secrets:
      - source: homeassistant-secrets
        target: /config/secrets.yaml

  mqtt:
    extends:
      file: ../service.yml
      service: base
    container_name: mqtt
    hostname: mqtt.vip.bear-network
    image: "eclipse-mosquitto:latest"
    ports:
      - "9001" # websockets
      - "1883:1883"
    volumes:
      - ./mqtt.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
      - certs:/etc/letsencrypt:ro
    secrets:
      - mqtt-password

  mqttui:
    extends:
      file: ../service.yml
      service: base
    container_name: mqttui
    hostname: mqttui.vip.bear-network
    image: "ghcr.io/thomasnordquist/mqtt-explorer:latest"
    volumes:
      - mqttui-data:/app/data

volumes:
  mqtt-data:
  mqttui-data:
secrets:
  homeassistant-secrets:
    file: ../../secrets/homeassistant.yaml
  mqtt-password:
    file: ../../secrets/mqtt-internal-password